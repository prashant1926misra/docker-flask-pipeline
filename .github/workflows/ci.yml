name: CI/CD Pipeline

on:
 # workflow_dispatch:   # allow manual trigger
  push:
    branches:
      - main

env:
  AWS_REGION : "ap-south-1"

permissions:                                 # https://docs.github.com/en/actions/how-tos/secure-your-work/security-harden-deployments/oidc-in-aws
  id-token: write 
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'  

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest  

    - name: Run tests with pytest
      run: export PYTHONPATH=$(pwd) && pytest -v
        
    - name: configure aws credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::703623468959:role/GitHubActionsECRPushRole
        role-session-name: sample-role
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR                                   # https://github.com/aws-actions/amazon-ecr-login
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
    
    - name: Build, tag, and push docker image to Amazon ECR
      env:
         REGISTRY: ${{ steps.login-ecr.outputs.registry }}
         REPOSITORY: my-ecr-repo
         IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
        docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG


      

