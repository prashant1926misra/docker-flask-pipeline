# =======================================================================================================
# https://docs.github.com/en/actions/how-tos/secure-your-work/security-harden-deployments/oidc-in-aws
# https://github.com/aws-actions/amazon-ecr-login
# https://docs.github.com/en/actions/how-tos/deploy/deploy-to-third-party-platforms/amazon-elastic-container-service
# ========================================================================================================

name: CI/CD Pipeline

on:
 # workflow_dispatch:   # allow manual trigger
  push:
    branches:
      - main

env:
  AWS_REGION : "ap-south-1"
  ECS_SERVICE: "myapp-task-service-o3ya8zhh"
  ECS_CLUSTER: "myapp-cluster"
  ECS_TASK_DEFINITION: "infra/task-definition.json"
  CONTAINER_NAME: "myapp-container" 

permissions:                                 
  id-token: write 
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'  

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest  

    - name: Run tests with pytest
      run: export PYTHONPATH=$(pwd) && pytest -v
        
    - name: configure aws credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::703623468959:role/GitHubActionsECRPushRole
        role-session-name: sample-role
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR                                  
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
    
    - name: Build, tag, and push docker image to Amazon ECR
      id: build-image
      env:
         REGISTRY: ${{ steps.login-ecr.outputs.registry }}
         REPOSITORY: ecr-repo
         IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
        docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
        echo "image=$REGISTRY/$REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
    
    - name: Fill in the new image ID in the Amazon ECS task definition
      id: task-def 
      uses: aws-actions/amazon-ecs-render-task-definition@c804dfbdd57f713b6c079302a4c01db7017a36fc
      with: 
        task-definition: ${{ env.ECS_TASK_DEFINITION }}
        container-name: ${{ env.CONTAINER_NAME }}
        image: ${{ steps.build-image.outputs.image }}

    - name: Deploy Amazon ECS task definition
      uses: aws-actions/amazon-ecs-deploy-task-definition@df9643053eda01f169e64a0e60233aacca83799a
      with:
        task-definition: ${{ steps.task-def.outputs.task-definition }}
        service: ${{ env.ECS_SERVICE }}
        cluster: ${{ env.ECS_CLUSTER }}
        wait-for-service-stability: true


      

